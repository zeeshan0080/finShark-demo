      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=finShark_db;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
    networks:
      - app-network
    ports:
      - "8080:8080"
